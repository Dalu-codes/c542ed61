# One command to run ForeCheck locally:  docker compose up --build
# App: http://localhost:8080   API docs: http://localhost:8000/api/docs
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  # Runs the test suite in a container:  docker compose run --rm tests
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    profiles: ["test"]
